services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: portal-app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - TELVY_CLIENT=1001
      - TELVY_GATE_URL=http://127.0.0.1:4100

  caddy:
    image: caddy:2-alpine
    container_name: portal-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
